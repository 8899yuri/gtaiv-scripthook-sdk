name: Build TGHMod
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      # 1. 自动去网上下载一个原版的ScriptHook.dll (0.4.0)
      - name: Download ScriptHook.dll
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/FoulPlay/GTAIVScriptHook_0.4.0_SDK/raw/main/ScriptHook.dll" -OutFile "ScriptHook.dll"

      # 2. 用 dumpbin 导出函数名，再用 lib 生成 .lib 文件（跳过损坏的.sln！）
      - name: Generate ScriptHook.lib
        shell: cmd
        run: |
          dumpbin /exports ScriptHook.dll > ScriptHook.def
          powershell -Command "(Get-Content ScriptHook.def) | Select-Object -Skip 19 | Set-Content ScriptHook.def"
          lib /def:ScriptHook.def /out:ScriptHook.lib /machine:x86

      # 3. 用生成的 .lib 编译你的 TGHMod
      - name: Compile TGHMod
        shell: cmd
        run: |
          cl /LD /EHsc /O2 /MT /I. /IScriptHook TGHMod.cpp /link ScriptHook.lib /OUT:TGHMod.dll

      - name: Make ASI
        shell: cmd
        run: copy /Y TGHMod.dll TGHMod.asi

      - name: Upload ASI
        uses: actions/upload-artifact@v4
        with:
          name: TGHMod-ASI
          path: TGHMod.asi

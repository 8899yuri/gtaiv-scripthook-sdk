name: Build TGHMod

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-2019

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild ScriptHook.sln /p:Configuration=Release /p:Platform=Win32

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TGHMod
          path: |
            **/TGHMod.dll
            **/TGHMod.asi

name: Build TGHMod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile TGHMod
        shell: cmd
        run: |
          cl /LD /EHsc /O2 /MT /I. /IScriptHook TGHMod.cpp /link /FORCE:UNRESOLVED /OUT:TGHMod.dll

      - name: Make ASI
        shell: cmd
        run: copy /Y TGHMod.dll TGHMod.asi

      - name: Upload ASI
        uses: actions/upload-artifact@v4
        with:
          name: TGHMod-ASI
          path: TGHMod.asi

name: Build TGHMod
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86
    - name: Compile TGHMod
      shell: cmd
      run: cl /LD /EHsc /I. /IScriptHook TGHMod.cpp /link /OUT:TGHMod.dll
